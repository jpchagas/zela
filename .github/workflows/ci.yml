name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zela
          POSTGRES_PASSWORD: zela
          POSTGRES_DB: zela_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zela" --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://zela:zela@localhost:5432/zela_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest
      - name: Models and migrations agree
        run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg://zela:zela@localhost:5432/zela_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
